[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subnet-trainer"
version = "0.1.0"
description = "CLI trainer for subnetting, OSI layers and ports (Network+ / CCNA prep)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mihai Raad" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
subnet-trainer = "subnet_trainer.cli:main"

[tool.setuptools]
packages = ["subnet_trainer"]
